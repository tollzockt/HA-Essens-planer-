name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands topics description

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r requirements_test.txt
          # hassil / home-assistant-intents exactly as the installed Home Assistant needs them
          python -c "import json, pathlib, homeassistant; p = pathlib.Path(homeassistant.__file__).parent / 'components/conversation/manifest.json'; print(chr(10).join(json.loads(p.read_text())['requirements']))" > conversation_requirements.txt
          pip install -r conversation_requirements.txt
      - name: Run tests
        run: pytest -q

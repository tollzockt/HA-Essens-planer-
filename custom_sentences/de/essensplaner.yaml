# Deutsche Sätze für den eingebauten Home-Assistant-Sprachagenten.
# Kopiere diese Datei nach /config/custom_sentences/de/essensplaner.yaml
# und starte Home Assistant neu (bzw. Entwicklerwerkzeuge → YAML → Konversation neu laden).
# LLM-Agenten (z. B. Jarvis/Hermes, OpenAI, Ollama, MCP) brauchen diese Datei NICHT –
# sie bekommen die Essensplaner-Intents automatisch als Tools.
# Hinweis: Mit dieser Datei landet ALLES, was du per Sprache auf die Einkaufsliste setzt
# („Setz Milch auf die Einkaufsliste“, „Füge Milch zu meiner Einkaufsliste hinzu“, „Milch auf
# die Liste“ …), auf der Essensplaner-Liste (mit Laden und Preis) – nicht mehr auf der
# eingebauten Home-Assistant-Einkaufsliste und nicht in einer Liste, die du mit ihr
# synchronisierst (z. B. Bring!). Willst du das nicht, lösche unten den Block
# „essensplaner_add_shopping_item“.
language: de
intents:
  essensplaner_get_meals:
    data:
      - sentences:
          - "was gibt [es|'s] {date} [zu essen]"
          - "was gibt [es|'s] {date} zum {meal}"
          - "was gibt [es|'s] zum {meal} [{date}]"
          - "was (essen|kochen) wir {date} [zum {meal}]"
          - "was (essen|kochen) wir zum {meal} [{date}]"
          - "was steht {date} auf dem (essensplan|speiseplan|plan)"
          - "was ist {date} geplant"
  essensplaner_get_week_plan:
    data:
      - sentences:
          - "was gibt [es|'s] diese woche [zu essen]"
          - "wie sieht der (essensplan|speiseplan|wochenplan) aus"
          - "(lies|sag) [mir] den (essensplan|speiseplan|wochenplan) [vor]"
          - "was (essen|kochen) wir diese woche"
  essensplaner_plan_meal:
    data:
      - sentences:
          - "plane {dish} (für|am) {date} [zum {meal}]"
          - "plane {dish} zum {meal} [(für|am)] {date}"
          - "plane {dish} (für|zum) {meal}"
          - "(setz|setze|trag|trage) {dish} (für|am) {date} [zum {meal}] (auf den|in den) (essensplan|speiseplan|plan) [ein]"
  essensplaner_remove_meal:
    data:
      - sentences:
          - "(lösche|entferne|streiche) [das essen|die mahlzeit|alles] (von|für) {date} [zum {meal}] [aus dem (essensplan|speiseplan|plan)]"
          - "(lösche|entferne|streiche) [das|den|die] {meal} (von|für) {date} [aus dem (essensplan|speiseplan|plan)]"
  essensplaner_suggest_recipes:
    data:
      - sentences:
          - "was soll ich [heute] kochen"
          - "was (könnte|sollte|soll) ich [heute] kochen"
          - "was (könnten|sollten|sollen) wir [heute] (kochen|essen)"
          - "(schlag|schlage) [mir|uns] [ein|etwas|was] [rezept|gericht|essen] vor"
          - "hast du eine idee (fürs|für das|für) (essen|kochen|abendessen|mittagessen)"
          - "(schlag|schlage) [mir|uns] [ein|etwas|was] {tag} [rezept|gericht|essen] vor"
          - "was {tag}[es] (könnte|soll|sollte) ich kochen"
  essensplaner_get_recipe:
    data:
      - sentences:
          - "was brauche ich für {dish}"
          - "welche zutaten brauche ich für {dish}"
          - "wie (koche|mache|kocht|macht) (ich|man) {dish}"
          - "(zeig|zeige|lies|sag) [mir] das rezept (für|von) {dish} [vor]"
          - "(lies|sag) [mir] das rezept [vor]"
          - "was brauche ich (fürs|für das|für) (essen|abendessen|mittagessen|kochen)"
  essensplaner_search_recipes:
    data:
      - sentences:
          - "welche rezepte (habe ich|haben wir|gibt es) mit {query}"
          - "(suche|finde) rezepte mit {query}"
          - "welche rezepte (habe ich|haben wir|gibt es)"
  essensplaner_create_shopping_list:
    data:
      - sentences:
          - "(erstelle|mach|mache|schreib|schreibe) [mir|uns] die einkaufsliste [für die woche]"
          - "(setz|setze|schreib|schreibe) die zutaten auf die einkaufsliste"
  essensplaner_auto_plan:
    data:
      - sentences:
          - "plane [mir|uns] die (woche|nächsten tage)"
          - "(füll|fülle) den (essensplan|speiseplan|wochenplan) [automatisch] [aus]"
          - "(erstelle|mach|mache) [mir|uns] einen (essensplan|speiseplan|wochenplan)"
      - sentences:
          - "plane [mir|uns] die woche (günstig|sparsam|preiswert)"
          - "plane [mir|uns] eine (günstige|sparsame|preiswerte) woche"
        slots:
          strategy: "günstig"
      - sentences:
          - "plane [mir|uns] die woche mit [den] angeboten"
        slots:
          strategy: "angebote"
      - sentences:
          - "plane [mir|uns] die nächste woche"
          - "(erstelle|mach|mache) [mir|uns] einen (essensplan|speiseplan|wochenplan) für nächste woche"
        slots:
          start_date: "nächste woche"
  essensplaner_mark_cooked:
    data:
      - sentences:
          - "wir haben [heute] {dish} gekocht"
          - "ich habe [heute] {dish} gekocht"
          - "{dish} (ist|wurde) gekocht"
  essensplaner_cook_with:
    data:
      - sentences:
          - "was (kann|könnte|soll) ich mit {ingredients} (kochen|machen)"
          - "was (kann|könnte|soll) ich aus {ingredients} (kochen|machen)"
          - "was (können|könnten|sollen) wir mit {ingredients} (kochen|machen)"
          - "ich habe [noch] {ingredients} [da|übrig] was (kann|soll) ich (damit|daraus) (kochen|machen)"
  essensplaner_get_shopping_list:
    data:
      - sentences:
          - "was steht auf der einkaufsliste"
          - "(lies|sag) [mir] die einkaufsliste [vor]"
          - "was (muss|soll) ich (einkaufen|kaufen|besorgen)"
          - "was (müssen|sollen) wir (einkaufen|kaufen|besorgen)"
          - "was (muss|soll) ich (bei|beim|im) {store} (einkaufen|kaufen|besorgen|holen)"
          - "was (müssen|sollen) wir (bei|beim|im) {store} (einkaufen|kaufen|besorgen|holen)"
          - "was (kaufe|hole) ich (bei|beim|im) {store}"
          - "was (kaufen|holen) wir (bei|beim|im) {store}"
          - "was steht (für|bei) {store} auf der einkaufsliste"
          # own branch labels ("Lidl Arbeit"); words like "Supermarkt" read the whole list
          - "was (muss|soll) ich (bei|beim|im) {store_name:store} (einkaufen|kaufen|besorgen|holen)"
          - "was (müssen|sollen) wir (bei|beim|im) {store_name:store} (einkaufen|kaufen|besorgen|holen)"
          - "was (kaufe|hole) ich (bei|beim|im) {store_name:store}"
          - "was (kaufen|holen) wir (bei|beim|im) {store_name:store}"
          - "was steht (für|bei) {store_name:store} auf der einkaufsliste"
      # "die Drogerie": the saved drugstore(s) (Rossmann, dm, Müller, Budni)
      - sentences:
          - "was (muss|soll) ich (in der|im) (drogerie|drogeriemarkt) (einkaufen|kaufen|besorgen|holen)"
          - "was (müssen|sollen) wir (in der|im) (drogerie|drogeriemarkt) (einkaufen|kaufen|besorgen|holen)"
          - "was (kaufe|hole) ich (in der|im) (drogerie|drogeriemarkt)"
          - "was (kaufen|holen) wir (in der|im) (drogerie|drogeriemarkt)"
          - "was steht für die drogerie auf der einkaufsliste"
        slots:
          store: "drogerie"
  essensplaner_compare_prices:
    data:
      - sentences:
          - "wo (ist|sind|gibt es) {item} am (günstigsten|billigsten)"
          - "wo (bekomme|kaufe|kriege|kriegt man|bekommt man) [ich] {item} am (günstigsten|billigsten)"
          - "(vergleiche|vergleich) die preise (für|von) {item}"
          - "in welchem (laden|supermarkt) (ist|sind|gibt es) {item} am (günstigsten|billigsten)"
  essensplaner_set_shopping_store:
    data:
      # "immer" first: otherwise the item wildcard would swallow it
      # own branch labels ("Lidl Arbeit") only with "kaufen … bei", so that
      # "Hol die Wäsche im Keller" is not taken for a store
      - sentences:
          - "(kauf|kaufe|hol|hole) {item} immer (bei|beim|im) {store}"
          - "(kauf|kaufe) {item} immer (bei|beim) {store_name:store}"
          - "{item} (kaufe ich|kaufen wir|hole ich|holen wir) immer (bei|beim|im) {store}"
          - "{item} (kaufe ich|kaufen wir) immer (bei|beim) {store_name:store}"
        slots:
          always: true
      - sentences:
          - "(kauf|kaufe|hol|hole) {item} (bei|beim|im) {store}"
          - "(kauf|kaufe) {item} (bei|beim) {store_name:store}"
          - "{item} (kaufe ich|kaufen wir|hole ich|holen wir) (bei|beim|im) {store}"
          - "{item} (kaufe ich|kaufen wir) (bei|beim) {store_name:store}"
  essensplaner_add_shopping_item:
    data:
      # the same wordings as Home Assistant's own shopping list (HassShoppingListAddItem)
      - sentences:
          # "Setz Butter bei Lidl Arbeit auf die Einkaufsliste": the integration splits off
          # an own branch label ("… bei <Filiale>") from the item itself
          - "<ep_setzen> {item} (für|bei) {store} (auf|in) <ep_liste_akk>"
          - "<ep_setzen> {item} (auf|in) <ep_liste_akk>"
          - "{item} (auf|in) <ep_liste_akk> [(setzen|schreiben|nehmen|packen)]"
          - "(füge|füg) {item} [(zu|zur)] <ep_liste_dat> hinzu"
          - "(füge|füg) {item} [(zu|zum)] <ep_einkauf_dat> hinzu"
          - "(füge|füg) [(zu|zur)] <ep_liste_dat> {item} hinzu"
          - "ergänze {item} (auf|in) <ep_liste_dat>"
          - "{item} (auf|in) <ep_liste_dat> ergänzen"
          - "{item} [(zu|zur)] <ep_liste_dat> hinzufügen"
          - "{item} [(zu|zum)] <ep_einkauf_dat> hinzufügen"
          - "{item} [(auf|in)] <ep_liste_akk> hinzufügen"
  essensplaner_move_meal:
    data:
      - sentences:
          - "(verschiebe|verschieb|leg|lege|schieb|schiebe) {dish} (auf|nach) {date:to_date} [zum {meal:to_meal}]"
          - "(verschiebe|verschieb|leg|lege|schieb|schiebe) das essen von {date:from_date} (auf|nach) {date:to_date}"
          - "tausche [das essen von] {date:from_date} (und|mit) {date:to_date}"
  essensplaner_clear_shopping_list:
    data:
      - sentences:
          - "(leere|lösche|lösch) die [ganze|komplette] einkaufsliste"
          - "(mach|mache) die einkaufsliste leer"
      - sentences:
          - "(lösche|entferne) [alle] (erledigten|abgehakten) (einträge|artikel|sachen) [von der einkaufsliste]"
        slots:
          mode: "erledigte"
  essensplaner_get_offers:
    data:
      # offers of one store ("Hauptladen", own branch labels like "Lidl Arbeit" only with
      # "bei"); "wo ist Butter bei Lidl im Angebot": the integration splits off the store
      - sentences:
          - "welche angebote (gibt es|hat) (bei|beim|im) {store} [diese woche|gerade|aktuell]"
          - "was (ist|gibt es) (bei|beim|im) {store} [gerade|diese woche|aktuell] im angebot"
          - "was hat {store} [gerade|diese woche|aktuell] im angebot"
          - "wo (ist|gibt es) {query} (bei|beim|im) {store} [gerade] im angebot"
          - "gibt es {query} (bei|beim|im) {store} [gerade] im angebot"
          - "welche angebote (gibt es|hat) (bei|beim) {store_name:store}"
          - "was (ist|gibt es) (bei|beim) {store_name:store} im angebot"
      - sentences:
          - "welche angebote gibt es [diese woche|gerade|aktuell]"
          - "was ist [gerade|diese woche] im angebot"
          - "wo (ist|gibt es) {query} [gerade] im angebot"
          - "gibt es {query} [gerade] im angebot"
      - sentences:
          - "welche angebote gibt es nächste woche"
        slots:
          when: "nächste woche"
      - sentences:
          - "was (ist|gibt es) (in der|im) (drogerie|drogeriemarkt) [gerade|diese woche|aktuell] im angebot"
          - "welche angebote (gibt es|hat) (die drogerie|der drogeriemarkt) [diese woche|gerade|aktuell]"
          - "welche angebote gibt es (in der|im) (drogerie|drogeriemarkt) [diese woche|gerade|aktuell]"
          - "welche drogerie angebote gibt es [diese woche|gerade|aktuell]"
        slots:
          store: "drogerie"
  essensplaner_set_price:
    data:
      # the regular price of a store (a leaflet offer is no sentence: LLM tool add_offer)
      - sentences:
          - "[merk dir] {item:product} kostet (bei|beim|im) {store} [jetzt] {price}"
  essensplaner_get_costs:
    data:
      - sentences:
          - "was kostet der (essensplan|speiseplan|wochenplan) [diese woche]"
          - "wie viel (budget|geld) habe ich [noch] [übrig] [für essen]"
          - "wie teuer ist [der] (essensplan|speiseplan|wochenplan)"
      - sentences:
          - "was kostet der (essensplan|speiseplan|wochenplan) nächste woche"
        slots:
          week: "nächste"
expansion_rules:
  # verbs incl. the forms speech recognition often writes ("setzt", "schreibt")
  ep_setzen: "(setz|setze|setzt|schreib|schreibe|schreibt|nimm|nehme|pack|packe)"
  ep_liste_akk: "[(meine|unsere|die) ][einkaufs[ ]]liste"
  ep_liste_dat: "[(meiner|unserer|der) ][einkaufs[ ]]liste"
  ep_einkauf_dat: "[(meinem|unserem|dem) ]einkauf"

# Deutsche Sätze für den eingebauten Home-Assistant-Sprachagenten.
# Kopiere diese Datei nach /config/custom_sentences/de/essensplaner.yaml
# und starte Home Assistant neu (bzw. Entwicklerwerkzeuge → YAML → Konversation neu laden).
# LLM-Agenten (z. B. Jarvis/Hermes, OpenAI, Ollama, MCP) brauchen diese Datei NICHT –
# sie bekommen die Essensplaner-Intents automatisch als Tools.
language: de
intents:
  essensplaner_get_meals:
    data:
      - sentences:
          - "was gibt [es|'s] {date} [zu essen]"
          - "was gibt [es|'s] {date} zum {meal}"
          - "was gibt [es|'s] zum {meal} [{date}]"
          - "was (essen|kochen) wir {date} [zum {meal}]"
          - "was (essen|kochen) wir zum {meal} [{date}]"
          - "was steht {date} auf dem (essensplan|speiseplan|plan)"
          - "was ist {date} geplant"
  essensplaner_get_week_plan:
    data:
      - sentences:
          - "was gibt [es|'s] diese woche [zu essen]"
          - "wie sieht der (essensplan|speiseplan|wochenplan) aus"
          - "(lies|sag) [mir] den (essensplan|speiseplan|wochenplan) [vor]"
          - "was (essen|kochen) wir diese woche"
  essensplaner_plan_meal:
    data:
      - sentences:
          - "plane {dish} (für|am) {date} [zum {meal}]"
          - "plane {dish} zum {meal} [(für|am)] {date}"
          - "plane {dish} (für|zum) {meal}"
          - "(setz|setze|trag|trage) {dish} (für|am) {date} [zum {meal}] (auf den|in den) (essensplan|speiseplan|plan) [ein]"
  essensplaner_remove_meal:
    data:
      - sentences:
          - "(lösche|entferne|streiche) [das essen|die mahlzeit|alles] (von|für) {date} [zum {meal}] [aus dem (essensplan|speiseplan|plan)]"
          - "(lösche|entferne|streiche) [das|den|die] {meal} (von|für) {date} [aus dem (essensplan|speiseplan|plan)]"
  essensplaner_suggest_recipes:
    data:
      - sentences:
          - "was soll ich [heute] kochen"
          - "was (könnte|sollte|soll) ich [heute] kochen"
          - "was (könnten|sollten|sollen) wir [heute] (kochen|essen)"
          - "(schlag|schlage) [mir|uns] [ein|etwas|was] [rezept|gericht|essen] vor"
          - "hast du eine idee (fürs|für das|für) (essen|kochen|abendessen|mittagessen)"
          - "(schlag|schlage) [mir|uns] [ein|etwas|was] {tag} [rezept|gericht|essen] vor"
          - "was {tag}[es] (könnte|soll|sollte) ich kochen"
  essensplaner_get_recipe:
    data:
      - sentences:
          - "was brauche ich für {dish}"
          - "welche zutaten brauche ich für {dish}"
          - "wie (koche|mache|kocht|macht) (ich|man) {dish}"
          - "(zeig|zeige|lies|sag) [mir] das rezept (für|von) {dish} [vor]"
          - "(lies|sag) [mir] das rezept [vor]"
          - "was brauche ich (fürs|für das|für) (essen|abendessen|mittagessen|kochen)"
  essensplaner_search_recipes:
    data:
      - sentences:
          - "welche rezepte (habe ich|haben wir|gibt es) mit {query}"
          - "(suche|finde) rezepte mit {query}"
          - "welche rezepte (habe ich|haben wir|gibt es)"
  essensplaner_create_shopping_list:
    data:
      - sentences:
          - "(erstelle|mach|mache|schreib|schreibe) [mir|uns] die einkaufsliste [für die woche]"
          - "(setz|setze|schreib|schreibe) die zutaten auf die einkaufsliste"
  essensplaner_auto_plan:
    data:
      - sentences:
          - "plane [mir|uns] die (woche|nächsten tage)"
          - "(füll|fülle) den (essensplan|speiseplan|wochenplan) [automatisch] [aus]"
          - "(erstelle|mach|mache) [mir|uns] einen (essensplan|speiseplan|wochenplan)"
      - sentences:
          - "plane [mir|uns] die woche (günstig|sparsam|preiswert)"
          - "plane [mir|uns] eine (günstige|sparsame|preiswerte) woche"
        slots:
          strategy: "günstig"
      - sentences:
          - "plane [mir|uns] die woche mit [den] angeboten"
        slots:
          strategy: "angebote"
      - sentences:
          - "plane [mir|uns] die nächste woche"
          - "(erstelle|mach|mache) [mir|uns] einen (essensplan|speiseplan|wochenplan) für nächste woche"
        slots:
          start_date: "nächste woche"
  essensplaner_mark_cooked:
    data:
      - sentences:
          - "wir haben [heute] {dish} gekocht"
          - "ich habe [heute] {dish} gekocht"
          - "{dish} (ist|wurde) gekocht"
  essensplaner_cook_with:
    data:
      - sentences:
          - "was (kann|könnte|soll) ich mit {ingredients} (kochen|machen)"
          - "was (kann|könnte|soll) ich aus {ingredients} (kochen|machen)"
          - "was (können|könnten|sollen) wir mit {ingredients} (kochen|machen)"
          - "ich habe [noch] {ingredients} [da|übrig] was (kann|soll) ich (damit|daraus) (kochen|machen)"
  essensplaner_get_shopping_list:
    data:
      - sentences:
          - "was steht auf der einkaufsliste"
          - "(lies|sag) [mir] die einkaufsliste [vor]"
          - "was (muss|soll) ich (einkaufen|kaufen|besorgen)"
          - "was (müssen|sollen) wir (einkaufen|kaufen|besorgen)"
  essensplaner_move_meal:
    data:
      - sentences:
          - "(verschiebe|verschieb|leg|lege|schieb|schiebe) {dish} (auf|nach) {date:to_date} [zum {meal:to_meal}]"
          - "(verschiebe|verschieb|leg|lege|schieb|schiebe) das essen von {date:from_date} (auf|nach) {date:to_date}"
          - "tausche [das essen von] {date:from_date} (und|mit) {date:to_date}"
  essensplaner_clear_shopping_list:
    data:
      - sentences:
          - "(leere|lösche|lösch) die [ganze|komplette] einkaufsliste"
          - "(mach|mache) die einkaufsliste leer"
      - sentences:
          - "(lösche|entferne) [alle] (erledigten|abgehakten) (einträge|artikel|sachen) [von der einkaufsliste]"
        slots:
          mode: "erledigte"
  essensplaner_get_offers:
    data:
      - sentences:
          - "welche angebote gibt es [diese woche|gerade|aktuell]"
          - "was ist [gerade|diese woche] im angebot"
          - "wo (ist|gibt es) {query} [gerade] im angebot"
          - "gibt es {query} [gerade] im angebot"
      - sentences:
          - "welche angebote gibt es nächste woche"
        slots:
          when: "nächste woche"
  essensplaner_get_costs:
    data:
      - sentences:
          - "was kostet der (essensplan|speiseplan|wochenplan) [diese woche]"
          - "wie viel (budget|geld) habe ich [noch] [übrig] [für essen]"
          - "wie teuer ist [der] (essensplan|speiseplan|wochenplan)"
      - sentences:
          - "was kostet der (essensplan|speiseplan|wochenplan) nächste woche"
        slots:
          week: "nächste"

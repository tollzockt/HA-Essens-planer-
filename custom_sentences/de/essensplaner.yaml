    values:
      - "frühstück"
      - "mittagessen"
      - "mittag"
      - "abendessen"
      - "abendbrot"
      - "abend"
      - "snack"
      - "nachmittag"
  tag:
    values:
      - in: "vegetarisch"
        out: "vegetarisch"
      - in: "vegetarisches"
        out: "vegetarisch"
      - in: "veganes"
        out: "vegan"
      - in: "vegan"

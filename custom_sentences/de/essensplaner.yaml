      - "montag mittag"
      - "montag abend"
      - "am montag mittag"
      - "am montag abend"
      - "nächsten montag"
      - "kommenden montag"
      - "dienstag"
      - "am dienstag"
      - "dienstag mittag"
      - "dienstag abend"
      - "am dienstag mittag"
      - "am dienstag abend"

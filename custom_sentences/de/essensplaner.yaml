      - "kommenden dienstag"
      - "mittwoch"
      - "am mittwoch"
      - "mittwoch mittag"
      - "mittwoch abend"
      - "am mittwoch mittag"
      - "am mittwoch abend"
      - "nächsten mittwoch"
      - "kommenden mittwoch"
      - "donnerstag"
      - "am donnerstag"
      - "donnerstag mittag"
      - "donnerstag abend"
      - "am donnerstag mittag"
      - "am donnerstag abend"
      - "nächsten donnerstag"
      - "kommenden donnerstag"
      - "freitag"
      - "am freitag"
      - "freitag mittag"
      - "freitag abend"
      - "am freitag mittag"
      - "am freitag abend"
      - "nächsten freitag"
      - "kommenden freitag"
      - "samstag"
      - "am samstag"
      - "samstag mittag"
      - "samstag abend"
      - "am samstag mittag"
      - "am samstag abend"
      - "nächsten samstag"
      - "kommenden samstag"
      - "sonntag"

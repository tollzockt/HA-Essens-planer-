      selector:
        text:

set_price:
  fields:
    ingredient:
      required: true
      example: "Butter"
      selector:
        text:
    price:
      example: 1.99
      selector:
        number:
          min: 0
          max: 1000
          step: 0.01
          mode: box
          unit_of_measurement: "€"
    amount:
      default: 1
      example: 250
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    unit:
      default: Stück
      example: g
      selector:
        text:
    store:
      example: "Aldi"
      selector:
        text:
    remove:
      default: false
      selector:
        boolean:

